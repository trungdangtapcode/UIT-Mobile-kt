[versions]
kotlin = "2.1.20"
agp = "8.9.2"
ksp = "2.1.20-1.0.32"
coroutines = "1.10.2"
datetime = "0.6.2"
serialization = "1.8.1"
ktor = "3.1.2"
ksoup = "0.2.3"
room = "2.7.1"
compose = "2025.04.01"
lifecycle = "2.9.0"

[libraries]
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version = "1.44.0" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version = "1.44.0" }
ktlint = { module = "com.pinterest.ktlint:ktlint-cli", version = "1.5.0" }
detekt = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version = "1.23.8" }
koin-android = { module = "io.insert-koin:koin-android", version = "4.0.4" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
work = { module = "androidx.work:work-runtime-ktx", version = "2.10.1" }
core-ktx = { module = "androidx.core:core-ktx", version = "1.16.0" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.1.4" }
gson = { module = "com.google.code.gson:gson", version = "2.12.1" }
junit = { module = "org.junit.jupiter:junit-jupiter", version = "5.12.2" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.12.2" }
turbine = { module = "app.cash.turbine:turbine", version = "1.2.0" }
robolectric = { module = "org.robolectric:robolectric", version = "4.14.1" }
junit4 = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
